name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./cmd/aura-tracker-gcp

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Raise MIN_COVERAGE when the total settles higher; keep 1-2 points of
      # headroom so small refactors do not fail CI.
      - name: Enforce coverage floor
        env:
          MIN_COVERAGE: "55.0"
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          if [ -z "$total" ]; then
            echo "::error::no total line in the coverage report"
            exit 1
          fi
          echo "coverage ${total}% (floor ${MIN_COVERAGE}%)"
          echo "### Coverage: ${total}% (floor ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v total="$total" -v minimum="$MIN_COVERAGE" 'BEGIN { if (total + 0 < minimum + 0) { printf "coverage %.1f%% is below %.1f%%\n", total, minimum; exit 1 } }'

      - name: Test IAM setup script
        run: bash scripts/setup-iam_test.sh

      - name: Check Dockerfile Go version matches go.mod
        run: |
          mod="$(awk '$1 == "go" { print $2 }' go.mod)"
          builder="$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)"
          # The builder must stay pinned to a full image digest.
          if ! grep -Eq '^FROM golang:[0-9.]+-alpine@sha256:[0-9a-f]{64} AS builder$' Dockerfile; then
            echo "::error file=Dockerfile::builder image must be pinned as golang:<version>-alpine@sha256:<64 hex digits>"
            exit 1
          fi
          # Same major.minor, and the builder must not be older than go.mod
          # (an older builder silently downloads a different toolchain).
          if [ "${mod%.*}" != "${builder%.*}" ] || [ "$(printf '%s\n%s\n' "$mod" "$builder" | sort -V | head -n1)" != "$mod" ]; then
            echo "::error file=Dockerfile::builder golang:${builder} does not match go ${mod} in go.mod"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          args: --timeout=5m

  goreleaser-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.17.1
          args: check

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build local image
        run: docker build --tag aura-tracker-gcp:ci .

      - name: Check the release image uses the same runtime base
        run: |
          runtime="$(grep -E '^FROM alpine:' Dockerfile)"
          release="$(grep -E '^FROM ' Dockerfile.release)"
          if ! grep -Eq '^FROM alpine:[0-9.]+@sha256:[0-9a-f]{64}$' <<<"$release"; then
            echo "::error file=Dockerfile.release::runtime image must be pinned as alpine:<version>@sha256:<64 hex digits>"
            exit 1
          fi
          if [ "$runtime" != "$release" ]; then
            echo "::error file=Dockerfile.release::base '${release}' differs from the Dockerfile runtime '${runtime}'"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Same layout GoReleaser uses for dockers_v2: <platform>/<binary>.
      - name: Build the release image from a prebuilt binary
        run: |
          context="$(mktemp -d)"
          mkdir -p "${context}/linux/amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "${context}/linux/amd64/aura-tracker-gcp" ./cmd/aura-tracker-gcp
          docker buildx build --platform linux/amd64 --load --tag aura-tracker-gcp:release-ci --file Dockerfile.release "$context"
          test "$(docker inspect --format '{{.Config.User}}' aura-tracker-gcp:release-ci)" = "65532:65532"
          docker run --rm --entrypoint sh aura-tracker-gcp:release-ci -c 'test -x /aura-tracker-gcp && dot -V'

  security:
    name: Vulnerability and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Scan repository and history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (Node 24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
