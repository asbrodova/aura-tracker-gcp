version: 2

project_name: aura-tracker-gcp

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: aura-tracker-gcp
    main: ./cmd/aura-tracker-gcp
    binary: aura-tracker-gcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    disable: false

# Multi-arch image on GitHub Container Registry, built with docker buildx from
# the binaries above. The release workflow logs in to ghcr.io, then signs the
# pushed digest with cosign and attests its build provenance.
dockers_v2:
  - id: ghcr
    ids:
      - aura-tracker-gcp
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/asbrodova/aura-tracker-gcp
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Self-hosted GCP intelligence engine for incidents, security, architecture, drift, and cost."
      org.opencontainers.image.source: https://github.com/asbrodova/aura-tracker-gcp
      org.opencontainers.image.url: https://github.com/asbrodova/aura-tracker-gcp
      org.opencontainers.image.documentation: https://github.com/asbrodova/aura-tracker-gcp/wiki
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

release:
  github:
    owner: asbrodova
    name: aura-tracker-gcp
  draft: false
  prerelease: auto

homebrew_casks:
  - name: aura-tracker-gcp
    repository:
      owner: asbrodova
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: https://github.com/asbrodova/aura-tracker-gcp
    description: "Self-hosted GCP intelligence engine for incidents, security, architecture, drift, and cost."
    license: Apache-2.0

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
